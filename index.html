<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A spinning 3D ASCII bouquet in kraft paper, naturally curved stems, shimmering hearts, and twinkling stars. I love you Samantha!" />
    <title>for Samantha</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

  <body>
    <main>
      <canvas id="bouquet" tabindex="0" role="img" aria-label="A full three-dimensional ASCII bouquet of pastel pink, butter yellow, and baby blue carnations and smaller tulips, seated in kraft paper with curved stems, shimmering heart-shaped ASCII art, and twinkling stars. I love you Samantha!" aria-describedby="instructions">
        A bouquet of carnations and tulips in kraft paper, with curved stems, shimmering hearts, and stars. I love you Samantha!

      <p id="instructions" class="sr-only">Drag to turn the bouquet. Press Space to pause or resume the animation. Reduced-motion preferences are respected.</p>
